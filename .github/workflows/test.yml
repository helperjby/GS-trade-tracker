name: Test

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        # 런타임 의존성 0 — pytest 만. (벤더 드리프트 검사는 SEAssist 체크아웃이 필요해 로컬 build.bat 몫)
        run: python -m pip install --upgrade pip && pip install pytest

      - name: Run tests
        run: python -X utf8 -m pytest tests -q -p no:cacheprovider

      - name: Install hub dependencies
        # hub/ 는 src/ 무결합 독립 배포(aiohttp 하나) — 관측기의 "런타임 의존성 0" 규칙과 별개
        run: pip install -r hub/requirements.txt

      - name: Run hub tests
        run: python -X utf8 -m pytest hub/tests -q -p no:cacheprovider
